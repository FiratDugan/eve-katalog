# Kataloğu oluşturup GitHub Pages'te yayınlar.
# Firmanın Google E-Tablosundaki "Katalog > Kataloğu güncelle" menüsü bu akışı
# yeni fiyatlarla başlatır. Tablonun anahtarı yalnızca akış başlatabilir, depoya yazamaz;
# fiyatları depoya bu akış kaydeder. Actions sekmesinden elle de çalıştırılabilir:
# "fiyatlar" boş bırakılırsa depodaki fiyatlarla yeniden oluşturur.
# Zamanlanmış çalışma yok: GitHub, 60 gün hareketsiz depolarda zamanlanmış akışları kapatıyor.
name: Katalog

on:
  workflow_dispatch:
    inputs:
      fiyatlar:
        description: "Tablodan gelen fiyatlar (JSON). Boş: depodaki fiyatlar kullanılır."
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: katalog
  cancel-in-progress: false

jobs:
  olustur:
    # build.py görselleri macOS'un sips aracıyla küçültüyor; Chrome bu makinede kurulu geliyor
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Tablodan gelen fiyatları yaz
        if: inputs.fiyatlar != ''
        env:
          FIYATLAR: ${{ inputs.fiyatlar }}
        run: python3 -c 'import json, os; print(json.dumps(json.loads(os.environ["FIYATLAR"]), ensure_ascii=False, indent=2))' > kaynak/fiyatlar.json

      - name: Kataloğu oluştur
        run: python3 kaynak/build.py

      - name: Fiyatları depoya kaydet
        if: inputs.fiyatlar != ''
        run: |
          GECERLILIK=$(python3 -c 'import json; print(json.load(open("kaynak/fiyatlar.json"))["gecerlilik"])')
          git config user.name "Katalog"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kaynak/fiyatlar.json
          git diff --cached --quiet || { git commit -m "Fiyatlar güncellendi (geçerlilik: $GECERLILIK)"; git push; }

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: cikti/web

  yayinla:
    needs: olustur
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.yayin.outputs.page_url }}
    steps:
      - id: yayin
        uses: actions/deploy-pages@v5
