# Kataloğu oluşturup GitHub Pages'te yayınlar.
# Firmanın Google E-Tablosundaki "Katalog > Kataloğu güncelle" menüsü bu akışı
# tablodaki ürün bilgileri ve fiyatlarla başlatır. Tablonun anahtarı yalnızca akış başlatabilir,
# depoya yazamaz; değişiklikleri depoya bu akış kaydeder. Actions sekmesinden elle de çalıştırılabilir:
# "veri" boş bırakılırsa depodaki bilgilerle yeniden oluşturur.
# Zamanlanmış çalışma yok: GitHub, 60 gün hareketsiz depolarda zamanlanmış akışları kapatıyor.
name: Katalog

on:
  workflow_dispatch:
    inputs:
      veri:
        description: "Tablodan gelen ürün bilgileri ve fiyatlar (gzip + base64 JSON). Boş: depodaki bilgiler kullanılır."
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: katalog
  cancel-in-progress: false

jobs:
  olustur:
    # build.py görselleri macOS'un sips aracıyla küçültüyor; Chrome bu makinede kurulu geliyor
    runs-on: macos-latest
    # Normalde ~10 dk; takılırsa saatlerce beklemesin
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      # Pillow: web sayfa görselleri webp olarak kaydedilir (yoksa daha ağır jpg'ye düşer)
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python3 -m pip install pillow

      - name: Tablodan gelen bilgileri yaz
        if: inputs.veri != ''
        env:
          VERI: ${{ inputs.veri }}
        run: python3 kaynak/tablodan.py

      - name: Kataloğu oluştur
        run: python3 kaynak/build.py

      - name: Değişiklikleri depoya kaydet
        if: inputs.veri != ''
        run: |
          GECERLILIK=$(python3 -c 'import json; print(json.load(open("kaynak/fiyatlar.json"))["gecerlilik"])')
          git config user.name "Katalog"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kaynak/katalog.json kaynak/fiyatlar.json
          git diff --cached --quiet || { git commit -m "Tablodan güncellendi (geçerlilik: $GECERLILIK)"; git push; }

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: cikti/web

  yayinla:
    needs: olustur
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.yayin.outputs.page_url }}
    steps:
      - id: yayin
        uses: actions/deploy-pages@v5
